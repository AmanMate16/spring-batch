name: SonarQube

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build project
        run: mvn clean verify
        
      - name: Check Sonar URL
        run: |
          echo "SONAR_HOST_URL from vars = '${{ vars.SONAR_HOST_URL }}'"
          curl -I "${{ vars.SONAR_HOST_URL }}"

      - name: SonarQube Scan for branch
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


      - name: SonarQube Scan for pull request
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          args: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
